<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAVARI — Destinos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Panama.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar" id="navbar">
  <a class="logo" href="Paises.html">KAVARI</a>
</header>

<!-- CONTENIDO PRINCIPAL -->
<main style="padding: 120px 40px; text-align: center;">
  
  <h1 style="font-family: 'Nunito', sans-serif; font-size: 48px; color: #0d1f3c; margin-bottom: 20px;">
    Elige tu destino
  </h1>
  <p style="color: #64748b; margin-bottom: 60px; font-size: 18px;">
    Selecciona un país para descubrir su guía completa
  </p>
  
  <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">
    
    <!-- BOTÓN PANAMÁ -->
    <button class="dest-btn" onclick="irAPais('panama')" style="
        background: #0d1f3c; 
        color: white; 
        padding: 20px 40px; 
        border: none; 
        border-radius: 50px; 
        font-family: 'Nunito', sans-serif; 
        font-weight: 800; 
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
    " onmouseover="this.style.background='#f0b429'; this.style.color='#0d1f3c'; this.style.transform='translateY(-5px)'"
       onmouseout="this.style.background='#0d1f3c'; this.style.color='white'; this.style.transform='translateY(0)'">
        🇵🇦 Panamá
    </button>
    
    <!-- BOTÓN COSTA RICA -->
    <button class="dest-btn" onclick="irAPais('costa-rica')" style="
        background: #0d1f3c; 
        color: white; 
        padding: 20px 40px; 
        border: none; 
        border-radius: 50px; 
        font-family: 'Nunito', sans-serif; 
        font-weight: 800; 
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
    " onmouseover="this.style.background='#f0b429'; this.style.color='#0d1f3c'; this.style.transform='translateY(-5px)'"
       onmouseout="this.style.background='#0d1f3c'; this.style.color='white'; this.style.transform='translateY(0)'">
        🇨🇷 Costa Rica
    </button>
    
    <!-- BOTÓN COLOMBIA -->
    <button class="dest-btn" onclick="irAPais('colombia')" style="
        background: #0d1f3c; 
        color: white; 
        padding: 20px 40px; 
        border: none; 
        border-radius: 50px; 
        font-family: 'Nunito', sans-serif; 
        font-weight: 800; 
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
    " onmouseover="this.style.background='#f0b429'; this.style.color='#0d1f3c'; this.style.transform='translateY(-5px)'"
       onmouseout="this.style.background='#0d1f3c'; this.style.color='white'; this.style.transform='translateY(0)'">
        🇨🇴 Colombia
    </button>
    
  </div>
  
</main>

<script>
function irAPais(codigoPais) {
    // Guardar el país seleccionado en localStorage
    localStorage.setItem('paisSeleccionado', codigoPais);
    // Redirigir a la página de información
    window.location.href = 'destino.html';
}
</script>

</body>
</html>
